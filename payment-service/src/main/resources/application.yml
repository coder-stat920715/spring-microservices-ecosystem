server:
  port: 8083
  shutdown: graceful
spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config}
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
payment:
  provider:
    base-url: ${PAYMENT_PROVIDER_URL:http://localhost:9999}
    ssl-bundle: ${PAYMENT_SSL_BUNDLE:}
resilience4j:
  circuitbreaker:
    instances:
      paymentProvider:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
  retry:
    instances:
      paymentProvider:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.client.HttpClientErrorException

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

---
spring:
  config:
    activate:
      on-profile: mtls
  ssl:
    bundle:
      pem:
        mtls:
          keystore:
            certificate: file:/etc/mtls/tls.crt
            private-key: file:/etc/mtls/tls.key
          truststore:
            certificate: file:/etc/mtls/ca.crt
server:
  ssl:
    bundle: mtls
    client-auth: need
eureka:
  instance:
    secure-port-enabled: true
    non-secure-port-enabled: false
    secure-port: ${server.port}
  # Outbound mTLS to the payment provider reuses the same bundle:
payment:
  provider:
    ssl-bundle: mtls
