# Placeholders like ${RDS_ENDPOINT} come from `terraform output`; render with envsubst before applying.
# In production replace the Secret with External Secrets Operator / Secrets Store CSI (AWS Secrets Manager).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: enterprise
data:
  CONFIG_SERVER_URL: http://config-server.enterprise.svc.cluster.local:8888
  EUREKA_URL: http://discovery-server-0.discovery-server.enterprise.svc.cluster.local:8761/eureka/,http://discovery-server-1.discovery-server.enterprise.svc.cluster.local:8761/eureka/,http://discovery-server-2.discovery-server.enterprise.svc.cluster.local:8761/eureka/
  POSTGRES_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/orders?sslmode=require
  MONGO_URI: mongodb://${DOCDB_USER}:${DOCDB_PASSWORD}@${DOCDB_ENDPOINT}:27017/orders_read?tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false
  REDIS_HOST: ${REDIS_ENDPOINT}
  REDIS_SSL: "true"
  KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP_TLS}
  KAFKA_SECURITY_PROTOCOL: SSL
  OIDC_ISSUER: https://${OIDC_HOST}/realms/enterprise
  OIDC_JWKS_URI: https://${OIDC_HOST}/realms/enterprise/protocol/openid-connect/certs
  TRACING_SAMPLING: "0.1"
  PAYMENT_PROVIDER_URL: https://payments.provider.example
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: enterprise
type: Opaque
stringData:
  CONFIG_USER: config
  CONFIG_PASSWORD: ${CONFIG_PASSWORD}
  CONFIG_ENCRYPT_KEY: ${CONFIG_ENCRYPT_KEY}
  POSTGRES_USER: orders_admin
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
