# Requires cert-manager. A private CA signs short-lived, auto-rotated X.509 certs used by Spring SSL
# bundles (mounted at /etc/mtls: tls.crt, tls.key, ca.crt).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ecosystem-internal-ca
  secretName: internal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca
---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: config-server-tls
  namespace: enterprise
spec:
  secretName: config-server-tls
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: ["server auth", "client auth"]
  dnsNames:
    - config-server
    - config-server.enterprise.svc
    - config-server.enterprise.svc.cluster.local
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
---

apiVersion: cert-manager.io/v1
