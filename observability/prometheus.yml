global:
  scrape_interval: 15s
scrape_configs:
  # docker-compose: static targets on each container's management port
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:9090", "order-command-service:9090", "order-query-service:9090",
                  "payment-service:9090", "config-server:9090", "discovery-server:9090"]
