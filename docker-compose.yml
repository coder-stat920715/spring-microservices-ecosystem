# Local development stack. Start infra first, register the connector, then the apps:
#   docker compose up -d postgres mongo redis kafka keycloak connect otel-collector prometheus grafana
#   curl -X PUT -H 'Content-Type: application/json' --data @debezium/postgres-outbox-connector.local.json \
#        http://localhost:8084/connectors/orders-outbox-connector/config
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment: {POSTGRES_DB: orders, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10}

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["./sql/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  connect:
    image: quay.io/debezium/connect:2.7
    ports: ["8084:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on: [kafka, postgres]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--hostname-strict=false"]
    environment: {KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin}
    ports: ["8180:8080"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./observability/otel-collector-local.yml:/etc/otel/config.yml:ro"]
    ports: ["4318:4318"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/spring-ecosystem.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  config-server:
    build: {context: ., dockerfile: config-server/Dockerfile}
    ports: ["8888:8888"]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health/readiness || exit 1"], interval: 10s, retries: 12}

  discovery-server:
    build: {context: ., dockerfile: discovery-server/Dockerfile}
    ports: ["8761:8761"]

  api-gateway:
    build: {context: ., dockerfile: api-gateway/Dockerfile}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OIDC_ISSUER: http://localhost:8180/realms/enterprise
      OIDC_JWKS_URI: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on: [config-server, discovery-server, redis]

  order-command-service:
    build: {context: ., dockerfile: order-command-service/Dockerfile}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OIDC_ISSUER: http://localhost:8180/realms/enterprise
      OIDC_JWKS_URI: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      POSTGRES_URL: jdbc:postgresql://postgres:5432/orders
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8081:8081"]
    depends_on: [config-server, discovery-server, postgres, kafka]

  order-query-service:
    build: {context: ., dockerfile: order-query-service/Dockerfile}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OIDC_ISSUER: http://localhost:8180/realms/enterprise
      OIDC_JWKS_URI: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      MONGO_URI: mongodb://mongo:27017/orders_read
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8082:8082"]
    depends_on: [config-server, discovery-server, mongo, redis, kafka]

  payment-service:
    build: {context: ., dockerfile: payment-service/Dockerfile}
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OIDC_ISSUER: http://localhost:8180/realms/enterprise
      OIDC_JWKS_URI: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP: kafka:9092
      PAYMENT_PROVIDER_URL: http://payment-stub:9999
    ports: ["8083:8083"]
    depends_on: [config-server, discovery-server, kafka]
